/><text x="380" y="386.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#3B4252">re-check: active, not expired, payee allowed,</text><text x="380" y="401.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#3B4252">amount &lt;= perTx, fits window, balance ok</text><path d="M380,441 L888,441" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#ah)"/><rect x="539.056" y="422.8" width="191.888" height="17.2" fill="#ffffff" opacity="0.92"/><text x="635" y="434" text-anchor="middle" font-family="Consolas, monospace" font-size="11.2" font-style="normal" font-weight="400" fill="#374151">safeTransfer(payee, 80 mUSDC)</text><path d="M380,487 L648,487" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="396.432" y="468.8" width="237.136" height="17.2" fill="#ffffff" opacity="0.92"/><text x="515" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.2" font-style="normal" font-weight="400" fill="#374151">events PaymentApproved, PaymentExecuted</text>
